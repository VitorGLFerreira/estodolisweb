{% extends "base.html" %}
{% block title %}Tarefa | EsToDoList{% endblock %}
{%  block content %}
    <main class="max-w-xl mx-auto px-4 py-8">
        <form action="/adicionar" method="post"
                class="bg-white rounded-xl shadow p-6 space-y-4">
            <h2 class="text-xl font-bold">Nova tarefa</h2>
            {% if erros %}
                <ul class="bg-red-100 text-red-700 rounded-lg px-4 py-3 space-y-1">
                    {% for erro in erros %}
                        <li>{{ erro }}</li>
                    {%  endfor %}
                </ul>
            {% endif %}

            <label for="Nome_tarefa" class="block font-medium">Nome</label>
            <input type="text" id="Nome_tarefa" name="Nome_tarefa"
                value="{{ dados.Nome_tarefa }}" required
                class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-indigo-400">
                
            <label for="Descricao" class="block font-medium">Descricao</label>
            <textarea id="Descricao" name="Descricao" rows="3"
                class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-indigo-400">{{ dados.Descricao or ""}}</textarea>

            <label for="Categoria" class="block font-medium">Categoria</label>

            <select id="Categoria" name="Categoria" required
                class="w-full border rounded-lg p-3 bg-white">

                {% for c in categorias %}
                    <option value="{{ c }}"
                        {% if dados.Categoria == c %}selected{% endif %}>
                        {{ c }}
                    </option>
                {% endfor %}

            </select>

            <label for="Data_prazo" class="block font-medium">Prazo</label>
            <input type="date" id="Data_prazo" name="Data_prazo"
                value="{{ dados.Data_prazo }}" required
                class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-indigo-400">

            <label for="Prioridade" class="block font-medium">Prioridade</label>
            <select id="Prioridade" name="Prioridade" required 
                class="w-full border rounded-lg p-3 bg-white">
                <option value="ALTA"
                    {% if dados.Prioridade == "ALTA" %}selected{% endif %}>Alta</option>
                <option value="MEDIA"
                    {% if dados.Prioridade == "MEDIA" %}selected{% endif %}>Média</option>
                <option value="BAIXA"
                    {% if dados.Prioridade == "BAIXA" %}selected{% endif %}>Baixa</option>
            </select>

            <div class="flex gap-2">
                <button type="submit" class="flex-1 bg-green-600 text-white rounded-lg p-3 font-semibold">Salvar
                </button>
                <a href="/" class="flex-1 text-center rounded-lg p-3 bg-slate-200">Cancelar</a>
            </div>

        </form>
    </main>
{% endblock %}
