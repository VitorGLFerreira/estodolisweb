<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>{% block title %} EsToDoList {% endblock %}</title>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
    <header class="bg-green-600 text-white">
        <div class="max-w-5x1 mx-auto px-4 py-4 flex items-center justify-between">
            <h1 class="text-x1 md: text-3xl font-bold">EsToDoList</h1>
        </div>
    </header>

    {% with mensagens = get_flashed_messages() %}
        {% if mensagens %}
            <div class="max-w-5xl mx-auto px-4 pt-4 space-y-2">
                {% for m in mensagens %}
                    <p class="bg-indigo-100 text-indigo-800 rounded-lg px-3 py-2">{{ m }}</p>
                {% endfor %}
            </div>
        {%  endif %}
    {%  endwith %}

    
    {% block content %}
    {% endblock %}
    
</body>
</html>
